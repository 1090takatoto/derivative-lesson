<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>微分係数 ― 平均変化率から接線の傾きへ</title>
<style>
/* ------------------------------------------------------------------
   明るい教室でのプロジェクタ投影を前提に、白背景のみで組んでいる。
   canvas の描画色は JS 側の C と対応させているため、片方だけ変えないこと。
   --s は文字サイズの倍率。投影時に 1.3 / 1.6 へ上げて後方の席から読ませる。
------------------------------------------------------------------- */
:root{
  --s:1;
  --bg:#ffffff; --panel:#f5f7fa; --card:#eef1f6; --edge:#d3dae4;
  --fg:#12181f; --sub:#5a6675;
  --a:#0b62c4; --b:#c2560a; --t:#0f7a3d; --err:#c02a1f;
  --btn:#ffffff; --btn-edge:#c3ccd8;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:calc(15px * var(--s));line-height:1.5}

/* ---------- ヘッダ ---------- */
.bar{display:flex;align-items:center;gap:calc(14px * var(--s));flex-wrap:wrap;
  padding:calc(10px * var(--s)) calc(14px * var(--s));border-bottom:1px solid var(--edge);
  background:var(--panel)}
h1{font-size:calc(17px * var(--s));margin:0;white-space:nowrap;font-weight:700}
.tools{display:flex;gap:calc(7px * var(--s));margin-left:auto;flex-wrap:wrap}

/* 定義式。分数は必ず縦に組む。横並びだと f(a) を h で割ると誤読される。 */
.def{display:flex;align-items:center;gap:calc(7px * var(--s));
  font-size:calc(15px * var(--s));white-space:nowrap}
.lim{display:inline-grid;justify-items:center;line-height:1.05}
.lim .lo{font-size:calc(10px * var(--s));color:var(--sub)}
.frac{display:inline-grid;justify-items:center;line-height:1.25;vertical-align:middle}
.frac .nu{padding:0 calc(6px * var(--s))}
.frac .de{padding:0 calc(6px * var(--s));border-top:1.5px solid currentColor;
  margin-top:calc(2px * var(--s))}

/* ---------- レイアウト ---------- */
/* パネル幅は画面に応じて縮める。iPad の縦向き（820〜834px）でも
   横並びを保てるよう、縦積みへの切り替えは 700px 未満に限る。 */
main{display:grid;
  grid-template-columns:1fr clamp(250px, 32vw, calc(360px * var(--s)));
  gap:calc(12px * var(--s));padding:calc(12px * var(--s));align-items:start}
main.closed{grid-template-columns:1fr}
main.closed aside{display:none}
@media (max-width:700px){
  /* iPhone の縦向きなど、横に並べるとグラフが狭くなりすぎる場合のみ縦積み */
  main{grid-template-columns:1fr}
  aside{order:2}
}
/* スマホの横向きは高さが足りない。ヘッダを詰めてグラフを1画面に収める。 */
@media (max-height:520px){
  .bar{padding:calc(5px * var(--s)) calc(10px * var(--s));gap:calc(9px * var(--s))}
  h1{font-size:calc(15px * var(--s))}
  .def{font-size:calc(13px * var(--s))}
  main{padding:calc(8px * var(--s));gap:calc(8px * var(--s))}
  canvas{height:calc(100vh - 150px);min-height:190px}
  aside{max-height:calc(100vh - 150px)}
}

/* ---------- グラフ ---------- */
.stage{min-width:0;position:relative}
canvas{width:100%;height:clamp(300px,72vh,880px);display:block;
  background:var(--panel);border:1px solid var(--edge);border-radius:12px;touch-action:none}
.legend{position:absolute;left:calc(10px * var(--s));top:calc(10px * var(--s));
  display:flex;flex-direction:column;gap:calc(5px * var(--s));
  background:rgba(255,255,255,.9);
  border:1px solid var(--edge);border-radius:8px;padding:calc(7px * var(--s)) calc(10px * var(--s));
  font-size:calc(12px * var(--s));pointer-events:none}
.legend div{display:flex;align-items:center;gap:calc(7px * var(--s));white-space:nowrap}
.legend div[hidden]{display:none}
.legend i{width:calc(20px * var(--s));height:0;border-top-width:3px;display:inline-block;flex:0 0 auto}
.legend b.dot{width:calc(11px * var(--s));height:calc(11px * var(--s));border-radius:50%;
  display:inline-block;flex:0 0 auto;margin-left:calc(4px * var(--s))}

/* ヘッダのボタン群の区切り。役割ごとにまとまって見えるようにする。 */
.sep{width:1px;align-self:stretch;background:var(--edge);margin:0 calc(3px * var(--s))}

/* ---------- サイドパネル ---------- */
aside{min-width:0;max-height:calc(100vh - 90px);overflow-y:auto;padding-right:calc(2px * var(--s))}
@media (max-width:860px){aside{max-height:none}}
.sec{background:var(--panel);border:1px solid var(--edge);border-radius:12px;
  margin-bottom:calc(10px * var(--s));overflow:hidden}
.sec>summary{cursor:pointer;list-style:none;padding:calc(9px * var(--s)) calc(12px * var(--s));
  font-size:calc(13px * var(--s));font-weight:700;color:var(--t);
  display:flex;align-items:center;gap:calc(7px * var(--s));user-select:none}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::before{content:"▸";transition:transform .15s;font-size:calc(11px * var(--s))}
.sec[open]>summary::before{transform:rotate(90deg)}
.sec .body{padding:0 calc(12px * var(--s)) calc(12px * var(--s))}

/* 点A・点B のまとまり。どちらの点をいじっているかが一目で分かるよう色帯で囲む。 */
.grp{border-left:calc(4px * var(--s)) solid var(--edge);padding-left:calc(10px * var(--s));
  margin-bottom:calc(14px * var(--s))}
.grp.pa{border-left-color:var(--a)}
.grp.pb{border-left-color:var(--b)}
.grp .hd{font-size:calc(13px * var(--s));font-weight:700;margin-bottom:calc(6px * var(--s));
  display:flex;align-items:center;gap:calc(6px * var(--s))}
.grp.pa .hd{color:var(--a)}
.grp.pb .hd{color:var(--b)}
.grp .hd .dot{width:calc(12px * var(--s));height:calc(12px * var(--s));border-radius:50%;
  display:inline-block}
.grp .note{font-size:calc(11.5px * var(--s));color:var(--sub);margin:0 0 calc(8px * var(--s));
  line-height:1.6}

.row{display:flex;align-items:center;gap:calc(7px * var(--s));margin:calc(8px * var(--s)) 0}
.row:first-child{margin-top:0}
.lbl{font-size:calc(12.5px * var(--s));color:var(--sub);white-space:nowrap}
select,button,input[type=text]{background:var(--btn);color:var(--fg);
  border:1px solid var(--btn-edge);border-radius:9px;
  padding:calc(8px * var(--s)) calc(11px * var(--s));font-size:calc(13.5px * var(--s));
  min-width:0;font-family:inherit}
button{cursor:pointer}
button:hover{border-color:var(--a)}
select{flex:1}
input[type=text]{flex:1;font-family:ui-monospace,monospace}
input.num{flex:0 1 calc(96px * var(--s));text-align:center;font-variant-numeric:tabular-nums;
  font-size:calc(15px * var(--s));font-weight:700}
input[type=range]{flex:1;accent-color:var(--b)}
button.primary{background:var(--a);color:#fff;border-color:var(--a);font-weight:700}
button.on{background:var(--t);color:#fff;border-color:var(--t);font-weight:700}
button.sm{padding:calc(7px * var(--s)) calc(10px * var(--s));font-size:calc(12.5px * var(--s))}
.chips{display:flex;flex-wrap:wrap;gap:calc(5px * var(--s));margin-top:calc(7px * var(--s))}
.chips button{padding:calc(5px * var(--s)) calc(10px * var(--s));
  font-size:calc(12.5px * var(--s));border-radius:20px}
.chips button.sel{background:var(--a);color:#fff;border-color:var(--a);font-weight:700}
.chips.warm button.sel{background:var(--b);color:#fff;border-color:var(--b)}
.hint{font-size:calc(11.5px * var(--s));color:var(--sub);margin:calc(8px * var(--s)) 0 0;line-height:1.6}
label.ck{font-size:calc(12.5px * var(--s));color:var(--sub);display:flex;
  align-items:center;gap:calc(6px * var(--s));cursor:pointer}
code{background:var(--card);padding:1px calc(5px * var(--s));border-radius:4px;
  font-size:calc(11.5px * var(--s))}
kbd{background:var(--card);border:1px solid var(--edge);border-bottom-width:2px;
  border-radius:4px;padding:0 calc(5px * var(--s));font-size:calc(11px * var(--s));font-family:inherit}

/* ---------- 数値（パネル最下部） ---------- */
.ro{background:var(--card);border:1px solid var(--edge);border-radius:10px;
  padding:calc(8px * var(--s)) calc(11px * var(--s));margin-bottom:calc(8px * var(--s))}
.ro .k{font-size:calc(11.5px * var(--s));color:var(--sub)}
.ro .v{font-size:calc(30px * var(--s));font-variant-numeric:tabular-nums;
  font-weight:700;line-height:1.15;white-space:nowrap}
.ro.main{border-color:var(--a);background:#fff}
.ro.main .v{color:var(--a)}
.ro.tan .v{color:var(--t)}
.ro .sub{font-size:calc(12px * var(--s));color:var(--sub);
  font-family:ui-monospace,monospace;white-space:nowrap;overflow-x:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:calc(8px * var(--s))}
.two .ro{margin-bottom:0}
.two .ro .v{font-size:calc(22px * var(--s))}
.msg{font-size:calc(12.5px * var(--s));color:var(--t);line-height:1.6;
  margin-top:calc(8px * var(--s));min-height:calc(30px * var(--s))}
.msg.err{color:var(--err)}
.msg.warn{color:var(--b);font-weight:700}
</style>
</head>
<body>

<header class="bar">
  <h1>微分係数</h1>
  <div class="def">
    <span>f&prime;(a) =</span>
    <span class="lim"><span>lim</span><span class="lo">h&rarr;0</span></span>
    <span class="frac"><span class="nu">f(a+h) &minus; f(a)</span><span class="de">h</span></span>
  </div>
  <div class="tools">
    <button id="tgPanel" class="sm">パネルを隠す</button>
    <button id="tgSize" class="sm">文字を大きく</button>
    <span class="sep"></span>
    <button id="tgTan">接線を表示する</button>
    <button id="tgCrd" class="sm">座標を表示</button>
    <button id="tgAux" class="sm">補助線を表示</button>
    <button id="tgSnap" class="sm">整数に止める</button>
    <span class="sep"></span>
    <button id="rv" class="sm">表示を元に戻す</button>
    <button id="rs" class="sm">すべて初期化</button>
  </div>
</header>

<main id="main">
  <section class="stage">
    <canvas id="cv"></canvas>
    <div class="legend">
      <div><i id="lg1"></i><span>A と B を通る直線</span></div>
      <div id="lg2row" hidden><i id="lg2"></i><span>接線（A で接する直線）</span></div>
      <div><i id="lg3"></i><span id="lgFn">y = f(x)</span></div>
    </div>
  </section>

  <aside id="side">

    <!-- 1. 点 A を動かす -->
    <details class="sec" open>
      <summary>点 A を動かす</summary>
      <div class="body">
        <div class="grp pa">
          <div class="chips">
            <button data-as="0">A を x = 0 へ</button>
            <button data-as="1">A を x = 1 へ</button>
            <button data-as="2">A を x = 2 へ</button>
          </div>
          <div class="row" style="margin-top:calc(12px * var(--s))">
            <span class="lbl">A の x 座標（手入力）</span>
            <input id="ia" class="num" type="text" inputmode="decimal" spellcheck="false">
          </div>
        </div>
      </div>
    </details>

    <!-- 2. 点 B を動かす -->
    <details class="sec" open>
      <summary>点 B を動かす</summary>
      <div class="body">
        <div class="grp pb">
          <div class="chips warm" id="hchips"></div>
          <div class="row" style="margin-top:calc(12px * var(--s))">
            <span class="lbl">A に近づける</span>
            <input id="hr" type="range" min="0" max="1000" value="850">
            <span class="lbl">遠ざける</span>
          </div>
          <div class="row">
            <span class="lbl">B の x 座標（手入力）</span>
            <input id="ih" class="num" type="text" inputmode="decimal" spellcheck="false">
          </div>
        </div>
      </div>
    </details>

    <!-- 3. h を 0 に近づける -->
    <details class="sec" open>
      <summary>h を 0 に近づける</summary>
      <div class="body">
        <div class="row">
          <span class="lbl">速さ</span>
          <span class="chips" id="spd" style="margin:0"></span>
        </div>
        <div class="row">
          <button id="anim" class="primary" style="flex:1">開始</button>
        </div>
      </div>
    </details>

    <!-- 5. 関数を変える -->
    <details class="sec">
      <summary>関数を変える</summary>
      <div class="body">
        <div class="row">
          <span class="lbl">f(x) =</span>
          <input id="expr" type="text" value="x^2" spellcheck="false" autocapitalize="off">
          <button id="ap" class="sm primary">適用</button>
        </div>
        <div class="chips" id="chips"></div>
        <p class="hint">入力例：<code>x^2</code> <code>sin(x)</code> <code>x^3/8-x</code>
          <code>sqrt(x)</code> <code>1/x</code> <code>exp(x)</code> <code>log(x)</code><br>
          <code>log</code> は自然対数（底 e）です。</p>
      </div>
    </details>

    <!-- 4. 数値 -->
    <details class="sec">
      <summary>数値</summary>
      <div class="body">
        <div class="ro main">
          <div class="k">平均変化率 ＝ ( f(a+h) &minus; f(a) ) &divide; h</div>
          <div class="v" id="m">-</div>
          <div class="sub" id="fx">-</div>
        </div>
        <div class="two">
          <div class="ro tan"><div class="k">微分係数 f&prime;(a)</div><div class="v" id="d">-</div></div>
          <div class="ro"><div class="k">平均変化率と微分係数の差</div><div class="v" id="er">-</div></div>
        </div>
        <div class="msg" id="msg"></div>
      </div>
    </details>

  </aside>
</main>

<script>
"use strict";
const el = i => document.getElementById(i);
const cv = el('cv'), ctx = cv.getContext('2d');

/* canvas 内では CSS 変数を使えないので、:root と対応する色をここに持つ */
const C = {
  grid:'#e3e8ef', axis:'#9aa7b6', tick:'#5a6675', curve:'#46536a',
  sec:'#0b62c4', tan:'#0f7a3d', aux:'#9aa7b6', auxTx:'#5a6675',
  A:'#0b62c4', B:'#c2560a', tagBg:'rgba(255,255,255,.93)', ring:'rgba(18,24,31,.7)', pointEdge:'#ffffff'
};

/* cx,cy は表示の中心、spanX/spanY は最低限見せたい範囲 */
const PRE = [
  {src:'x^2',     label:'x²',     f:x=>x*x,           d:x=>2*x,             cx:1,  cy:4.5, spanX:8, spanY:11, a:1, h:1},
  {src:'sin(x)',  label:'sin x',  f:x=>Math.sin(x),   d:x=>Math.cos(x),     cx:0,  cy:0,   spanX:10,spanY:6, a:1, h:2},
  {src:'x^3/8-x', label:'x³/8−x', f:x=>x*x*x/8-x,     d:x=>3*x*x/8-1,       cx:0,  cy:0,   spanX:10,spanY:8, a:1, h:2},
  {src:'sqrt(x)', label:'√x',     f:x=>Math.sqrt(x),  d:x=>0.5/Math.sqrt(x),cx:2.5,cy:1,   spanX:8, spanY:6, a:1, h:3},
  {src:'1/x',     label:'1/x',    f:x=>1/x,           d:x=>-1/(x*x),        cx:0,  cy:0,   spanX:9, spanY:9, a:1, h:2},
  {src:'exp(x)',  label:'eˣ',     f:x=>Math.exp(x),   d:x=>Math.exp(x),     cx:0,  cy:3,   spanX:9, spanY:9, a:1, h:2}
];

let cur = {...PRE[0]}, a = 1, b = 2;
let W = 0, H = 0, scale = 1, ox = 0, oy = 0;
let animId = null, drag = null, snapMode = 'free', showTan = false, sizeStep = 0;
/* h を 0 に近づけきった「極限に到達した」状態。
   割線を接線と同じ傾きで描いて視覚的に一致させる。点を動かすと解除される。 */
let atLimit = false;
/* 旧チェックボックスの置き換え。ヘッダのトグルボタンで切り替える。 */
let showCoord = true, showAux = true;

/* アニメーションの減衰率。1 に近いほどゆっくり。
   授業では説明しながら見せるため、既定を最も遅い設定にしている。 */
const SPEEDS = [
  {label:'ゆっくり', k:0.990},
  {label:'ふつう',   k:0.975},
  {label:'はやい',   k:0.950}
];
let speed = 0;

const X = x => ox + x*scale, Y = y => oy - y*scale;
const iX = p => (p-ox)/scale, iY = p => (oy-p)/scale;
const r3 = v => Math.round(v*1000)/1000;
const fmt = v => (!isFinite(v) ? '—' : (Math.abs(v) < 5e-4 ? 0 : v).toFixed(3));
const nf = v => String(r3(v));
const norm = s => String(s).toLowerCase().replace(/\s+/g,'');
const isInt = v => Math.abs(v - Math.round(v)) < 1e-9;
const defined = v => typeof v === 'number' && isFinite(v);
let fsCache = 1;
const FS = () => fsCache;
function refreshFS(){
  // getComputedStyle は毎フレーム呼ぶと負荷になる。倍率は文字サイズを変えたときだけ変わる。
  fsCache = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--s')) || 1;
}

/* ================= 式のパース =================
   new Function に渡す前に識別子をホワイトリストで検査する。
   文字種チェックだけでは alert(1) や document.cookie が通ってしまうため。 */
const FUNCS = ['sin','cos','tan','asin','acos','atan','sinh','cosh','tanh',
  'sqrt','cbrt','abs','exp','log','log2','log10','sign','floor','ceil','round','pow','min','max'];
const ALLOWED = new Set([...FUNCS, 'x', 'pi', 'e']);

function compile(src){
  const s = norm(src);
  if (!s) throw new Error('式が空です');
  if (!/^[0-9x+\-*/^().,a-z]+$/.test(s)) throw new Error('使えない文字が含まれています');
  for (const id of (s.match(/[a-z][a-z0-9]*/g) || [])) {
    if (!ALLOWED.has(id)) throw new Error('使えない記号です：' + id);
  }
  const body = s.replace(/\^/g,'**')
    .replace(new RegExp('\\b(' + FUNCS.join('|') + ')\\b','g'), 'Math.$1')
    .replace(/\bpi\b/g,'Math.PI').replace(/\be\b/g,'Math.E');
  const f = new Function('x', 'return (' + body + ');');
  if (typeof f(0.7137) !== 'number') throw new Error('数値になりません');
  return f;
}
function der(x){
  if (cur.d) return cur.d(x);
  const e = 1e-5;
  return (cur.f(x+e) - cur.f(x-e)) / (2*e);
}

/* ================= 表示範囲 ================= */
function view(){
  // x と y で同じ scale を使うので、画面上の傾きが数学的な傾きと一致する
  scale = Math.min(W / cur.spanX, H / cur.spanY);
  ox = W/2 - cur.cx*scale;
  oy = H/2 + cur.cy*scale;
}
function resize(keep){
  refreshFS();
  const dpr = Math.min(devicePixelRatio || 1, 2), r = cv.getBoundingClientRect();
  W = r.width; H = r.height;
  cv.width = W*dpr; cv.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if (!keep) view();
  sync();
}

/* ================= 吸着 ================= */
function snapX(x){
  if (snapMode === 'int') return Math.round(x);
  if (snapMode === 'ten') return Math.round(x*10)/10;
  if (snapMode === 'free') return r3(x);
  const n = Math.round(x);
  if (Math.abs(x-n)*scale < 11) return n;
  const t = Math.round(x*10)/10;
  if (Math.abs(x-t)*scale < 6) return r3(t);
  return r3(x);
}
function setA(v){ atLimit = false; const h = b-a; a = r3(v); b = r3(a+h); sync(); }
function setH(v){
  atLimit = false;
  if (Math.abs(v) < 0.001) v = (v < 0 ? -0.001 : 0.001);
  b = r3(a+v); sync();
}
// 点 B は絶対座標で指定する（点 A と同じ操作感にするため）
function setB(v){ setH(r3(v) - a); }

/* ================= 描画 ================= */
function gridStep(){
  const S=[0.001,0.002,0.005,0.01,0.02,0.05,0.1,0.2,0.5,1,2,5,10,20,50,100];
  for (const s of S){
    // 整数の目盛りは桁数が少なく狭い間隔でも読めるので、判定を緩める。
    // 一律に緩めると大きい画面で 0.5 刻みになって細かすぎるため、分けている。
    if (s * scale >= (s < 1 ? 34 : 22)) return s;
  }
  return 200;
}
function lab(v,s){ return s < 1 ? v.toFixed(String(s).split('.')[1].length) : String(Math.round(v)); }
function rr(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function line(x0,y0,m){
  if (!isFinite(m)) return;
  ctx.beginPath();
  ctx.moveTo(0, Y(y0 + m*(iX(0)-x0)));
  ctx.lineTo(W, Y(y0 + m*(iX(W)-x0)));
  ctx.stroke();
}
function pt(px,py,c,halo){
  if (!isFinite(px) || !isFinite(py)) return;
  if (halo){ ctx.fillStyle = c + '2e'; ctx.beginPath(); ctx.arc(px,py,20,0,7); ctx.fill(); }
  ctx.fillStyle = c; ctx.strokeStyle = C.pointEdge; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(px,py,8,0,7); ctx.fill(); ctx.stroke();
}
function drawCurve(){
  ctx.strokeStyle = C.curve; ctx.lineWidth = 2.5;
  ctx.beginPath();
  let prev = null;
  for (let px = 0; px <= W; px += 1.5){
    const y = cur.f(iX(px));
    if (!defined(y)) { prev = null; continue; }
    const py = Y(y);
    // 1/x のような不連続点で左右が繋がり、存在しない漸近線が描かれるのを防ぐ
    if (prev !== null && Math.abs(py - prev) > H*2) prev = null;
    if (prev === null) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    prev = py;
  }
  ctx.stroke();
}
/* ------------------------------------------------------------------
   ラベルの重なり回避。
   座標タグと補助線のラベルは近い場所に出るため、そのまま描くと重なって
   読めなくなる。描画前に位置を決め、既に置いた矩形と重なる候補は捨てる。
------------------------------------------------------------------- */
let placed = [];

function hits(r, q){
  const m = 2; // 余白。ぴったり隣接も避ける
  return !(r.x + r.w + m < q.x || q.x + q.w + m < r.x ||
           r.y + r.h + m < q.y || q.y + q.h + m < r.y);
}
/* 候補位置を優先順に試し、画面内に収まり既存と重ならない最初の場所を返す。
   すべて駄目なら先頭の候補を画面内へ寄せて使う（読めないよりはまし）。 */
function place(cands, w, h){
  for (const c of cands){
    const r = {x:c.x, y:c.y, w, h};
    if (r.x < 3 || r.x + w > W-3 || r.y < 3 || r.y + h > H-3) continue;
    if (!placed.some(q => hits(r, q))) { placed.push(r); return r; }
  }
  const c = cands[0];
  const r = {x:Math.max(3, Math.min(W-w-3, c.x)), y:Math.max(3, Math.min(H-h-3, c.y)), w, h};
  placed.push(r); return r;
}
/* 点のまわりの4隅を候補にする。preferBelow で下側を優先するか決める。 */
function aroundPoint(px, py, w, h, preferBelow){
  const g = 13;
  const below = [{x:px+g, y:py+g}, {x:px-g-w, y:py+g}, {x:px+g, y:py-g-h}, {x:px-g-w, y:py-g-h}];
  const above = [{x:px+g, y:py-g-h}, {x:px-g-w, y:py-g-h}, {x:px+g, y:py+g}, {x:px-g-w, y:py+g}];
  return preferBelow ? below : above;
}

function drawTagBox(r, txt, color, fs){
  ctx.fillStyle = C.tagBg; rr(r.x, r.y, r.w, r.h, 5); ctx.fill();
  ctx.strokeStyle = color; ctx.globalAlpha = .7; ctx.lineWidth = 1.2;
  rr(r.x, r.y, r.w, r.h, 5); ctx.stroke(); ctx.globalAlpha = 1;
  ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = 'bold ' + fs + 'px ui-monospace,SFMono-Regular,monospace';
  ctx.fillText(txt, r.x + fs/2, r.y + r.h/2);
}
function drawAuxBox(r, txt, fs){
  ctx.fillStyle = 'rgba(255,255,255,.88)'; rr(r.x, r.y, r.w, r.h, 4); ctx.fill();
  ctx.fillStyle = C.auxTx; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = 'bold ' + fs + 'px sans-serif';
  ctx.fillText(txt, r.x + 5, r.y + r.h/2);
}

function draw(){
  const fa = cur.f(a), fb = cur.f(b), s = gridStep();
  ctx.clearRect(0,0,W,H);

  ctx.lineWidth = 1;
  const x0 = Math.ceil(iX(0)/s)*s, x1 = iX(W), y0 = Math.ceil(iY(H)/s)*s, y1 = iY(0);
  for (let g = x0; g <= x1; g += s){
    ctx.strokeStyle = Math.abs(g) < s/2 ? C.axis : C.grid;
    ctx.beginPath(); ctx.moveTo(X(g),0); ctx.lineTo(X(g),H); ctx.stroke();
  }
  for (let g = y0; g <= y1; g += s){
    ctx.strokeStyle = Math.abs(g) < s/2 ? C.axis : C.grid;
    ctx.beginPath(); ctx.moveTo(0,Y(g)); ctx.lineTo(W,Y(g)); ctx.stroke();
  }
  ctx.fillStyle = C.tick; ctx.font = (12*FS()) + 'px sans-serif';
  const ay = Math.min(H-4, Math.max(12, Y(0))), ax = Math.min(W-6, Math.max(14, X(0)));
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (let g = x0; g <= x1; g += s){
    if (Math.abs(g) < s/2) continue;
    ctx.fillText(lab(g,s), X(g), Math.min(H-17, ay+4));
  }
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let g = y0; g <= y1; g += s){
    if (Math.abs(g) < s/2) continue;
    ctx.fillText(lab(g,s), Math.max(26, ax-6), Y(g));
  }
  ctx.textAlign = 'right'; ctx.textBaseline = 'top'; ctx.fillText('0', ax-4, ay+4);
  ctx.textAlign = 'left';
  ctx.fillText('x', W-14, Math.min(H-19, ay+4));
  ctx.fillText('y', Math.min(W-14, ax+6), 4);

  drawCurve();

  if (showTan && defined(fa)){
    ctx.setLineDash([7,6]); ctx.strokeStyle = C.tan; ctx.lineWidth = 2.5;
    line(a, fa, der(a)); ctx.setLineDash([]);
  }

  if (defined(fa) && defined(fb)){
    ctx.strokeStyle = C.sec; ctx.lineWidth = 3;
    line(a, fa, atLimit ? der(a) : (fb-fa)/(b-a));
    if (showAux && !atLimit){
      // 線だけをここで描く。文字は座標タグに隠れないよう drawAuxLabels() で最後に描く。
      ctx.setLineDash([4,4]); ctx.strokeStyle = C.aux; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(X(a),Y(fa)); ctx.lineTo(X(b),Y(fa)); ctx.lineTo(X(b),Y(fb));
      ctx.stroke(); ctx.setLineDash([]);
    }
  }

  if (atLimit){ if (defined(fa)) pt(X(a), Y(fa), C.B, true); }
  else if (defined(fb)) pt(X(b), Y(fb), C.B, true);
  if (defined(fa)) pt(X(a), Y(fa), C.A, false);

  if (isInt(a) && defined(fa)){
    ctx.strokeStyle = C.ring; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(X(a), Y(fa), 14, 0, 7); ctx.stroke();
  }
  // ---- ラベル類は位置を先に確定させてから描く（重なり回避のため） ----
  placed = [];
  const boxes = [];

  // 補助線のラベルを先に確保する。線に沿った位置しか取れず自由度が低いため。
  if (showAux && !atLimit && defined(fa) && defined(fb)){
    const afs = 15 * FS();
    ctx.font = 'bold ' + afs + 'px sans-serif';
    const bh = afs * 1.44;
    if (Math.abs(X(b)-X(a)) > 26){
      const w = ctx.measureText('h').width + 10;
      const cx = (X(a)+X(b))/2 - w/2, base = Y(fa), d = fb > fa ? 1 : -1;
      const r = place([{x:cx, y:base + d*6}, {x:cx, y:base - d*6 - bh},
                       {x:cx, y:base + d*(6 + bh)}], w, bh);
      boxes.push({r, txt:'h', fs:afs, aux:true});
    }
    if (Math.abs(Y(fb)-Y(fa)) > 44){
      const tx = 'f(a+h)−f(a)', w = ctx.measureText(tx).width + 10;
      const cy = (Y(fa)+Y(fb))/2 - bh/2;
      const r = place([{x:X(b)+12, y:cy}, {x:X(b)-12-w, y:cy},
                       {x:X(b)+12, y:cy - bh - 4}], w, bh);
      boxes.push({r, txt:tx, fs:afs, aux:true});
    }
  }

  if (showCoord){
    const tfs = 12.5 * FS();
    ctx.font = 'bold ' + tfs + 'px ui-monospace,SFMono-Regular,monospace';
    const th = tfs + 9;
    if (!atLimit && defined(fb)){
      const txt = 'B (' + fmt(b) + ', ' + fmt(fb) + ')', w = ctx.measureText(txt).width + tfs;
      boxes.push({r:place(aroundPoint(X(b), Y(fb), w, th, false), w, th), txt, fs:tfs, color:C.B});
    }
    if (defined(fa)){
      const txt = 'A (' + fmt(a) + ', ' + fmt(fa) + ')', w = ctx.measureText(txt).width + tfs;
      boxes.push({r:place(aroundPoint(X(a), Y(fa), w, th, true), w, th), txt, fs:tfs, color:C.A});
    }
  } else {
    ctx.font = 'bold ' + (14*FS()) + 'px sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    if (!atLimit && defined(fb)){ ctx.fillStyle = C.B; ctx.fillText('B', X(b)+12, Y(fb)-10); }
    if (defined(fa)){ ctx.fillStyle = C.A; ctx.fillText('A', X(a)+12, Y(fa)-10); }
  }

  for (const bx of boxes){
    if (bx.aux) drawAuxBox(bx.r, bx.txt, bx.fs);
    else drawTagBox(bx.r, bx.txt, bx.color, bx.fs);
  }
}

/* ================= 状態の同期 ================= */
function clampH(){
  const h = b-a;
  if (Math.abs(h) < 0.001) b = a + (h < 0 ? -0.001 : 0.001);
  a = r3(a);
  // アニメーション中は b を 0.001 刻みに丸めない。
  // 丸めると1ステップの減少量が丸め幅に飲まれ、h が 0.02 付近で停滞して
  // 終了条件（h <= 0.001）に永久に到達しなくなる。
  if (!animId) b = r3(b);
}
function markChip(){
  const s = norm(el('expr').value);
  [...el('chips').children].forEach((c,i) => c.classList.toggle('sel', PRE[i].src === s));
}
function markH(){
  [...el('hchips').children].forEach(c =>
    c.classList.toggle('sel', Math.abs(parseFloat(c.dataset.bx) - b) < 1e-9));
}
function message(fa, fb, h){
  const box = el('msg');
  box.className = 'msg';
  if (atLimit && defined(fa)){
    box.textContent = 'h を限りなく 0 に近づけた結果、割線は接線とぴったり重なりました。'
      + 'この傾き ' + fmt(der(a)) + ' が微分係数 f′(a) です。'
      + 'h は 0 そのものにはできませんが、いくらでも 0 に近づけることができます。';
    return;
  }
  if (!defined(fa)){
    box.className = 'msg err';
    box.textContent = 'x = ' + fmt(a) + ' では f(x) が定義されないため、微分係数を考えることができません。a を動かしてください。';
    return;
  }
  if (!defined(fb)){
    box.className = 'msg err';
    box.textContent = 'x = ' + fmt(b) + ' では f(x) が定義されないため、平均変化率を計算できません。h を変えてください。';
    return;
  }
  const A = Math.abs(h);
  if (A <= 0.0015){
    box.textContent = 'h = 0.001。2点がほとんど重なり、割線は接線とほぼ一致しました。この傾きが微分係数 f′(a) です。';
  } else if (A < 0.05){
    box.textContent = '差がどんどん 0 に近づいています。割線は接線に限りなく近づきます。';
  } else if (A < 0.4){
    box.textContent = 'かなり近づきました。平均変化率が f′(a) に寄っていきます。';
  } else {
    box.textContent = '';
  }
}
function sync(){
  clampH(); markChip(); markH();
  const fa = cur.f(a), fb = cur.f(b), h = b-a, m = (fb-fa)/h, m0 = der(a);
  const ae = document.activeElement;
  if (ae !== el('ia')) el('ia').value = nf(a);
  if (ae !== el('ih')) el('ih').value = nf(b);
  el('m').textContent = fmt(atLimit ? m0 : m);
  el('d').textContent = fmt(m0);
  el('er').textContent = fmt(atLimit ? 0 : m - m0);
  el('fx').textContent = atLimit
    ? 'h → 0 のとき  平均変化率 → ' + fmt(m0)
    : '( ' + fmt(fb) + ' − ' + fmt(fa) + ' ) ÷ ' + fmt(h) + ' = ' + fmt(m);
  el('hr').value = Math.max(0, Math.min(1000,
    Math.round(1000*Math.log(Math.abs(h)/0.001)/Math.log(4000))));
  syncLegend();
  message(fa, fb, h);
  draw();
}

/* ================= 部品の生成 ================= */
PRE.forEach(p => {
  const bt = document.createElement('button');
  bt.textContent = p.label;
  bt.onclick = () => { atLimit = false; cur = {...p}; el('expr').value = p.src; a = p.a; b = r3(p.a + p.h); view(); sync(); };
  el('chips').appendChild(bt);
});
[0,2,3].forEach(v => {
  const bt = document.createElement('button');
  bt.textContent = 'B を x = ' + v + ' へ'; bt.dataset.bx = v;
  el('hchips').appendChild(bt);
});
el('hchips').onclick = e => {
  const v = e.target.dataset.bx;
  if (v === undefined) return;
  stopAnim(); setB(parseFloat(v));
};
SPEEDS.forEach((s,i) => {
  const bt = document.createElement('button');
  bt.textContent = s.label;
  bt.onclick = () => { speed = i; markSpeed(); };
  el('spd').appendChild(bt);
});
function markSpeed(){
  [...el('spd').children].forEach((c,i) => c.classList.toggle('sel', i === speed));
}

/* ================= 操作 ================= */
function apply(){
  atLimit = false;
  const src = el('expr').value;
  try {
    const f = compile(src), hit = PRE.find(p => p.src === norm(src));
    cur = hit ? {...hit, cx:cur.cx, cy:cur.cy, spanX:cur.spanX, spanY:cur.spanY}
              : {src, f, d:null, cx:cur.cx, cy:cur.cy, spanX:cur.spanX, spanY:cur.spanY};
    sync();
  } catch(e){
    el('msg').className = 'msg err';
    el('msg').textContent = '式を読み取れません。' + e.message;
  }
}
el('ap').onclick = apply;
el('expr').addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); apply(); el('expr').blur(); }
});
document.querySelectorAll('[data-a]').forEach(bt => bt.onclick = () => setA(a + parseFloat(bt.dataset.a)));
document.querySelectorAll('[data-as]').forEach(bt => bt.onclick = () => setA(parseFloat(bt.dataset.as)));

function readNum(inp, cb, onZero){
  const v = parseFloat(inp.value.replace(/[^\d.+\-]/g,''));
  if (!isFinite(v)) { sync(); return; }
  if (onZero && v === 0){ onZero(); return; }
  cb(v);
}
el('ia').addEventListener('change', () => readNum(el('ia'), setA));
el('ih').addEventListener('change', () => {
  stopAnim();
  const v = parseFloat(el('ih').value.replace(/[^\d.+\-]/g, ''));
  if (!isFinite(v)) { sync(); return; }
  if (Math.abs(v - a) < 1e-9){
    // B を A に重ねようとした＝h が 0。ここが授業の要点なので、黙って直さず理由を示す。
    sync();
    el('msg').className = 'msg warn';
    el('msg').textContent = 'B を A と同じ位置に置くと h = 0 になり、分母が 0 になって平均変化率を計算できません。'
      + 'だからこそ h を 0 そのものにはせず、限りなく 0 に近づけます。これが極限の考え方です。';
    return;
  }
  setB(v);
});
[el('ia'), el('ih')].forEach(i => i.addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); i.blur(); }
}));
el('rv').onclick = () => { view(); sync(); };
el('rs').onclick = () => {
  stopAnim(); atLimit = false; cur = {...PRE[0]}; el('expr').value = PRE[0].src;
  a = PRE[0].a; b = r3(PRE[0].a + PRE[0].h);
  snapMode = 'free'; showTan = false; speed = 0;
  showCoord = true; showAux = true;
  syncToggles(); markSpeed(); view(); sync();
};

function stopAnim(){
  if (animId){ cancelAnimationFrame(animId); animId = null; el('anim').textContent = '開始'; }
}
el('hr').oninput = e => {
  stopAnim(); atLimit = false;
  const sg = b < a ? -1 : 1;
  b = r3(a + sg*0.001*Math.pow(4000, e.target.value/1000));
  sync();
};
el('anim').onclick = () => {
  if (animId){ stopAnim(); return; }
  atLimit = false;
  if (Math.abs(b-a) < 0.02) b = a + (b < a ? -2.5 : 2.5);
  el('anim').textContent = '停止';
  const k = SPEEDS[speed].k;
  const stepFn = () => {
    b = a + (b-a)*k;
    if (Math.abs(b-a) <= 0.001){
      b = a + (b < a ? -0.001 : 0.001);
      atLimit = true;            // ここで割線と接線がぴったり重なる
      sync(); stopAnim(); return;
    }
    sync(); animId = requestAnimationFrame(stepFn);
  };
  animId = requestAnimationFrame(stepFn);
};

/* ---- ヘッダのトグル ---- */

/* ---- キーボード ---- */
addEventListener('keydown', e => {
  if (/^(INPUT|SELECT|TEXTAREA)$/.test((document.activeElement || {}).tagName || '')) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
    e.preventDefault();
    const d = e.shiftKey ? 1 : (e.altKey ? 0.001 : 0.1);
    setA(a + (e.key === 'ArrowRight' ? d : -d)); return;
  }
  const k = e.key.toLowerCase();
  if (k === 't'){ e.preventDefault(); el('tgTan').click(); }
  else if (k === 'p'){ e.preventDefault(); el('tgPanel').click(); }
  else if (e.key === ' '){ e.preventDefault(); el('anim').click(); }
});

/* ---- ポインタ ---- */
const ptrs = new Map();
let pinch = null, panFrom = null;
const loc = e => { const r = cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  const p = loc(e); ptrs.set(e.pointerId, p);
  if (ptrs.size === 2){
    drag = null; panFrom = null;
    const [p1,p2] = [...ptrs.values()];
    pinch = {d:Math.hypot(p1.x-p2.x, p1.y-p2.y), mx:(p1.x+p2.x)/2, my:(p1.y+p2.y)/2};
    return;
  }
  stopAnim();
  const da = Math.hypot(p.x-X(a), p.y-Y(cur.f(a))), db = Math.hypot(p.x-X(b), p.y-Y(cur.f(b)));
  if (Math.min(da,db) < 40){ drag = (da < db) ? 'a' : 'b'; move(p); } else { panFrom = p; }
});
function move(p){
  atLimit = false;
  const x = snapX(iX(p.x));
  if (drag === 'a'){ const h = b-a; a = x; b = r3(a+h); } else { b = x; }
  sync();
}
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const p = loc(e); ptrs.set(e.pointerId, p);
  if (pinch && ptrs.size >= 2){
    const [p1,p2] = [...ptrs.values()];
    const d = Math.hypot(p1.x-p2.x, p1.y-p2.y), mx = (p1.x+p2.x)/2, my = (p1.y+p2.y)/2;
    const k = Math.max(.2, Math.min(5, d/pinch.d));
    ox = mx-(pinch.mx-ox)*k; oy = my-(pinch.my-oy)*k; scale *= k;
    pinch = {d,mx,my}; draw(); return;
  }
  if (drag) move(p);
  else if (panFrom){ ox += p.x-panFrom.x; oy += p.y-panFrom.y; panFrom = p; draw(); }
});
function endPtr(e){
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (!ptrs.size){ drag = null; panFrom = null; }
}
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const p = loc(e), k = Math.exp(-e.deltaY*0.0015);
  ox = p.x-(p.x-ox)*k; oy = p.y-(p.y-oy)*k; scale *= k; draw();
}, {passive:false});

addEventListener('resize', () => resize(true));
syncToggles();
markSpeed();
resize(false);
</script>
</body>
</html>
